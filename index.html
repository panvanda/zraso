<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Žraso u Waltrovky</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b6a8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: frosted sticky header with day tabs + filters, then soft floating restaurant cards (two columns on wide screens). */
  --bg: #f7f0e3;
  --surface: #fffaf1;
  --ink: #1b2a33;
  --muted: #66716f;
  --line: #e6d9c2;
  --accent: #0b6a8a;
  --accent-2: #148f93;
  --accent-ink: #ffffff;
  --accent-soft: #e0eff0;
  --price: #b04a22;
  --price-bg: #fbe8d7;
  --veg: #5a7a1c;
  --soup-bg: #dcedee;
  --vegdish-bg: #e8efd2;
  --holand: #c2271b;
  --hover: #f3e9d4;
  --shadow: 0 1px 2px rgba(60, 45, 20, .06), 0 4px 14px rgba(60, 45, 20, .07);
  --shadow-up: 0 2px 4px rgba(60, 45, 20, .07), 0 12px 28px rgba(11, 60, 80, .14);
  --header-bg: rgba(247, 240, 227, .84);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101b21; --surface: #18262e; --ink: #f2e9d8; --muted: #9db0b2; --line: #2a3d47;
    --accent: #5cc3d8; --accent-2: #3fc2b0; --accent-ink: #072029; --accent-soft: #173a44;
    --price: #f0a468; --price-bg: #3a2a1a; --veg: #b4d36a; --soup-bg: #17353b; --vegdish-bg: #2a3519;
    --holand: #ff6b5a; --hover: #20323b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); --shadow-up: 0 2px 4px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
    --header-bg: rgba(16, 27, 33, .84);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101b21; --surface: #18262e; --ink: #f2e9d8; --muted: #9db0b2; --line: #2a3d47;
  --accent: #5cc3d8; --accent-2: #3fc2b0; --accent-ink: #072029; --accent-soft: #173a44;
  --price: #f0a468; --price-bg: #3a2a1a; --veg: #b4d36a; --soup-bg: #17353b; --vegdish-bg: #2a3519;
  --holand: #ff6b5a; --hover: #20323b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); --shadow-up: 0 2px 4px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --header-bg: rgba(16, 27, 33, .84);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); }
body { background-image: radial-gradient(1200px 400px at 10% -10%, var(--accent-soft), transparent 60%); background-attachment: fixed; }
header { position: sticky; top: 0; z-index: 5; background: var(--header-bg); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); border-bottom: 1px solid var(--line); padding: 12px 16px 10px; display: grid; gap: 10px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 800 1.5rem/1.1 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.meta { font-size: .8rem; color: var(--muted); }

.days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; }
.days button { flex: 1 0 auto; min-width: 58px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 6px 8px; font: 700 .9rem var(--body); cursor: pointer; display: grid; line-height: 1.15; box-shadow: var(--shadow); }
.days button small { font-weight: 400; color: var(--muted); font-size: .72rem; }
.days button:hover { border-color: var(--accent); background: var(--accent-soft); }
.days button[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); border-color: transparent; }
.days button[aria-pressed="true"] small { color: inherit; opacity: .9; }
.days button.today:not([aria-pressed="true"]) { border-color: var(--accent); }

.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: 400 .85rem var(--body); cursor: pointer; }
.chip:hover { background: var(--accent-soft); border-color: var(--accent); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
#f-veg { background: var(--vegdish-bg); border-color: color-mix(in srgb, var(--vegdish-bg) 60%, var(--line)); }
#f-veg:hover { filter: brightness(.97) saturate(1.2); }
#f-veg[aria-pressed="true"] { border-color: #9db85a; color: var(--ink); }
#q { flex: 1 1 140px; min-width: 120px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: .9rem var(--body); }
#q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding: 16px 16px 40px; max-width: 1100px; margin: 0 auto; display: grid; gap: 12px; }
.grid { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } }

.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; box-shadow: var(--shadow); }
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; border-radius: 16px 16px 0 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); opacity: 0; }
.card:hover { box-shadow: var(--shadow-up); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.card:hover::before { opacity: 1; }
.card.empty { opacity: .72; }
.card.empty:hover { opacity: 1; }

.head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.hl { display: flex; gap: 10px; align-items: center; min-width: 0; }
.head h2 { font: 700 1.1rem/1.2 var(--display); margin: 0; text-wrap: balance; }
.sub { font-size: .78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.tag { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); }

.logo { flex: 0 0 auto; width: 76px; height: 46px; border-radius: 10px; display: grid; place-items: center; font: 800 .95rem/1 var(--display); color: #fff; letter-spacing: .02em; }
.logo.img { display: flex; align-items: center; justify-content: center; padding: 5px 6px; border: 1px solid var(--line); overflow: hidden; }
.logo.img img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; margin: auto; }
.logo.img.sm img { max-width: 72%; max-height: 72%; }
.logo.img.md img { max-width: 88%; max-height: 88%; }


ul { list-style: none; margin: 0 -8px; padding: 0; display: grid; gap: 4px; }
li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 6px 8px; border-radius: 10px; }
li:hover { background: var(--hover); }
li.soup { background: var(--soup-bg); }
li.vegdish { background: var(--vegdish-bg); }
li.soup:hover, li.vegdish:hover { filter: brightness(.97) saturate(1.15); }
.holand { font-weight: 700; color: var(--holand); }
.cat { grid-column: 1 / -1; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.cat .v { color: var(--veg); margin-left: 6px; }
.dish { font-size: .93rem; }
.dish mark { background: color-mix(in srgb, var(--price) 25%, transparent); color: inherit; border-radius: 3px; }
.alg { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.price { align-self: start; font-weight: 700; color: var(--price); background: var(--price-bg); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; font-size: .88rem; }
.price:empty { display: none; }
.nomenu { font-size: .88rem; color: var(--muted); font-style: italic; }
.foot { font-size: .75rem; color: var(--muted); display: flex; justify-content: flex-end; }
.foot a { color: var(--accent); text-decoration: none; font-weight: 700; }
.foot a:hover { text-decoration: underline; }
.err { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }

@media (prefers-reduced-motion: no-preference) {
  .days button, .chip, #q, li, .foot a { transition: background .18s, border-color .18s, box-shadow .18s, transform .18s, color .18s, filter .18s; }
  .card { transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s, border-color .22s, opacity .22s; animation: rise .35s cubic-bezier(.2,.8,.2,1) backwards; }
  .card::before { transition: opacity .22s; }
  .logo { transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .days button:hover { transform: translateY(-1px); }
  .days button:active, .chip:active { transform: scale(.96); }
  .card:hover { transform: translateY(-3px); }
  .card:hover .logo { transform: scale(1.05) rotate(-1deg); }
  li:hover { transform: translateX(3px); }
  .foot a:hover { transform: translateX(2px); display: inline-block; }
  @keyframes rise { from { transform: translateY(8px); opacity: .55; } to { transform: none; opacity: 1; } }
}
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; padding: 2px 0 8px; margin: 0 -8px; }
@media (max-width: 560px) {
  .picks { grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 0 -6px; }
  .pick { padding: 5px 3px; gap: 4px; border-radius: 11px; }
  .pick .logo { width: 100%; max-width: 54px; height: 32px; border-radius: 7px; padding: 3px; }
  .pick .pname { font-size: .6rem; letter-spacing: -.01em; }
  .allicon { font-size: 1.1rem; }
}
@media (min-width: 900px) { .picks { margin: 0 -28px; } }
@media (min-width: 1180px) { .picks { margin: 0 -48px; } }
.pick { min-width: 0; display: grid; justify-items: center; gap: 6px; padding: 8px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); cursor: pointer; box-shadow: var(--shadow); font: inherit; }
.pick .logo { width: 72px; height: 42px; }
.pick .pname { max-width: 100%; font-size: .72rem; font-weight: 700; line-height: 1.15; text-align: center; overflow-wrap: normal; }
.pick:hover { border-color: var(--accent); background: var(--accent-soft); }
.pick[aria-pressed="true"] { border-color: transparent; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); }
.pick.off { opacity: .55; }
.pick.off:hover, .pick.off[aria-pressed="true"] { opacity: 1; }
.allicon { background: var(--accent-soft); color: var(--accent); font-size: 1.4rem; border: 1px solid var(--line); }
.pick[aria-pressed="true"] .allicon { background: rgba(255,255,255,.2); color: var(--accent-ink); border-color: transparent; }
@media (prefers-reduced-motion: no-preference) {
  .pick { transition: background .18s, border-color .18s, transform .18s, box-shadow .18s, opacity .18s; }
  .pick:hover { transform: translateY(-2px); box-shadow: var(--shadow-up); }
  .pick:active { transform: scale(.96); }
}
.card.noanim { animation: none; }
.grid.solo { grid-template-columns: minmax(0, 720px); justify-content: center; }
.grid.solo .card { padding: 16px 20px; gap: 10px; box-shadow: var(--shadow-up); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.grid.solo .card::before { opacity: 1; }
.grid.solo .head h2 { font-size: 1.35rem; }
.grid.solo .logo { width: 92px; height: 56px; }
.grid.solo .dish { font-size: 1.02rem; }
.grid.solo .price { font-size: .95rem; }
.grid.solo .card:hover { transform: none; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Žraso <span>u Waltrovky</span></h1>
    <div class="meta" id="meta">Načítám…</div>
  </div>
  <nav class="days" id="days" aria-label="Den v týdnu"></nav>
  <div class="filters">
    <button class="chip" id="f-all" aria-pressed="true">Vše</button>
    <button class="chip" id="f-walt" aria-pressed="false">Waltrovka</button>
    <button class="chip" id="f-okoli" aria-pressed="false">Okolí</button>
    <button class="chip" id="f-veg" aria-pressed="false">🌱 Bez masa</button>
    <label for="q" class="meta" style="position:absolute;left:-9999px">Hledat jídlo</label>
    <input id="q" type="search" placeholder="Hledat (řízek, curry…)" autocomplete="off">
  </div>
</header>
<main>
  <nav class="picks" id="picks" aria-label="Vybrat restauraci"></nav>
  <div class="grid" id="grid"></div>
</main>
<script>
(function () {
  const DOW = ["Ne", "Po", "Út", "St", "Čt", "Pá", "So"];
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const state = { data: null, day: null, zone: "all", veg: false, q: "", only: null, anim: null };
  const $ = (id) => document.getElementById(id);
  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // All-caps menu lines (La Fresca, Na Farkáně) read badly on a phone: turn them into sentence case.
  const pretty = (s) => {
    const letters = s.replace(/[^A-Za-zÀ-ž]/g, "");
    const caps = letters.replace(/[^A-ZÀ-ÞĀ-Ž]/g, "").length;
    if (letters.length && caps / letters.length > 0.6) {
      const low = s.toLocaleLowerCase("cs");
      return low.replace(/(^|[·:]\s*)(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase("cs"));
    }
    return s;
  };
  const norm = (s) => s.toLocaleLowerCase("cs").normalize("NFD").replace(/[̀-ͯ]/g, "");
  // Monogram badge: the page cannot load remote images, so each place gets its initials on a stable colour.
  const LOGO_COLORS = ["#1f6f4a", "#9a3b2e", "#2f5d8a", "#7a4f9a", "#8a6a12", "#2e7d7a", "#b0472b", "#4a5d23", "#5b4636", "#3b4a8a"];
  const LOGO_IMG = {"lafresca": "#ffffff", "salty": "#000000", "turnovska": "#000000", "puzzle": "#f7f7f7", "blackroyal": "#393432", "kotelna": "#000000", "nafarkane": "#000000", "bucka": "#514c3a", "majeru": "#f6f6f6", "automat": "#f7f7f7"};
  function logo(r) {
    if (LOGO_IMG[r.id]) return '<span class="logo img' + (["turnovska","salty","nafarkane"].includes(r.id) ? " sm" : r.id === "automat" ? " md" : "") + '" style="background:' + LOGO_IMG[r.id] + '"><img src="logos/' + r.id + '.webp" alt="" loading="lazy"></span>';
    const words = r.name.replace(/[–'’]/g, " ").split(/\s+/).filter((w) => w && /\p{L}/u.test(w));
    const ini = (words[0] || "?")[0] + (words[1] ? words[1][0] : (words[0] || "")[1] || "");
    let h = 0; for (const c of r.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return '<span class="logo" aria-hidden="true" style="background:' + LOGO_COLORS[h % LOGO_COLORS.length] + '">' + esc(ini.toUpperCase()) + "</span>";
  }

  function weekDays() {
    const start = new Date(state.data.weekStart + "T12:00:00");
    return [0, 1, 2, 3, 4].map((i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
  }

  function renderDays() {
    const today = iso(new Date());
    $("days").innerHTML = weekDays().map((d) => {
      const k = iso(d);
      return '<button type="button" data-day="' + k + '" aria-pressed="' + (k === state.day) + '" class="' + (k === today ? "today" : "") + '">' +
        DOW[d.getDay()] + "<small>" + d.getDate() + ". " + (d.getMonth() + 1) + ".</small></button>";
    }).join("");
  }

  function itemsFor(r, day) {
    const list = r.days && r.days[day];
    if (!list || !list.length) return null;
    return list.concat(r.everyday || []);
  }

  const SHORT = { lafresca: "La Fresca", salty: "Salty J's", turnovska: "Turnovská", puzzle: "Puzzle", automat: "Automat", blackroyal: "Black Royal", kotelna: "Kotelna", nafarkane: "Na Farkáně", bucka: "U Bůčka", majeru: "U Majerů" };
  function renderPicks() {
    const btn = (id, label, inner) => '<button type="button" class="pick' + (id === "" ? " all" : "") + '" data-only="' + id + '" aria-pressed="' + ((state.only || "") === id) + '">' + inner + '<span class="pname">' + esc(label) + "</span></button>";
    $("picks").innerHTML = btn("", "Vše", '<span class="logo allicon" aria-hidden="true">▦</span>') +
      state.data.restaurants.map((r) => {
        const has = !!itemsFor(r, state.day);
        return btn(r.id, SHORT[r.id] || r.name, logo(r)).replace('class="pick"', 'class="pick' + (has ? "" : " off") + '"');
      }).join("");
  }

  function render() {
    renderPicks();
    const d = state.data, day = state.day, nq = norm(state.q.trim());
    const cards = d.restaurants
      .filter((r) => state.only ? r.id === state.only : (state.zone === "all" || r.zone === state.zone))
      .map((r) => {
        let items = itemsFor(r, day);
        const had = !!items;
        if (items) {
          if (state.veg) items = items.filter((i) => i.veg);
          if (nq) items = items.filter((i) => norm(i.name).includes(nq));
        }
        return { r, items, had };
      })
      .filter((c) => !(state.veg || nq) || (c.items && c.items.length))
      .sort((a, b) => {
        return (b.had ? 1 : 0) - (a.had ? 1 : 0);
      });

    $("grid").classList.toggle("solo", !!state.only);
    if (!cards.length) { $("grid").innerHTML = '<p class="nomenu">Nic neodpovídá filtru.</p>'; return; }
    $("grid").innerHTML = cards.map(({ r, items, had }) => {
      const body = !had
        ? '<p class="nomenu">Pro tento den menu zatím nezveřejnili.</p>'
        : "<ul>" + items.map((i) => {
            let name = esc(pretty(i.name));
            if (nq) {
              const plain = pretty(i.name), idx = norm(plain).indexOf(nq);
              if (idx >= 0) name = esc(plain.slice(0, idx)) + "<mark>" + esc(plain.slice(idx, idx + nq.length)) + "</mark>" + esc(plain.slice(idx + nq.length));
            }
            const cls = /^pol[eé]vk/i.test(i.cat) ? "soup" : (i.veg || /bez masa/i.test(i.cat)) ? "vegdish" : "";
            const hol = /holandsk/.test(norm(i.name)) && /rizek|rizk/.test(norm(i.name));
            return '<li class="' + cls + '"><span class="cat">' + esc(i.cat) + (i.veg ? '<span class="v">🌱</span>' : "") + "</span>" +
              '<span class="dish' + (hol ? ' holand' : '') + '">' + name + (i.alg ? ' <span class="alg">(' + esc(i.alg) + ")</span>" : "") + "</span>" +
              '<span class="price">' + (i.price ? i.price + " Kč" : "") + "</span></li>";
          }).join("") + "</ul>";
      return '<article data-id="' + r.id + '" class="card' + (had ? "" : " empty") + (r.id === state.anim ? " noanim" : "") + '">' +
        '<div class="head"><div class="hl">' + logo(r) + '<div><div class="tag">' + (r.zone === "waltrovka" ? "Waltrovka" : "Okolí") + "</div><h2>" + esc(r.name) + "</h2>" +
        '<div class="sub"><span>' + esc(r.place) + "</span>" + (r.hours ? "<span>" + esc(r.hours) + "</span>" : "") + "</div></div></div>" +
        "</div>" +
        body +
        '<div class="foot"><a href="' + esc(r.url) + '">Zdroj ↗</a></div></article>';
    }).join("");
  }

  function setZone(z) {
    state.zone = z; state.only = null;
    $("f-all").setAttribute("aria-pressed", z === "all");
    $("f-walt").setAttribute("aria-pressed", z === "waltrovka");
    $("f-okoli").setAttribute("aria-pressed", z === "okoli");
    render();
  }

  $("days").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-day]"); if (!b) return;
    state.day = b.dataset.day; renderDays(); render();
  });
  $("f-all").onclick = () => setZone("all");
  $("f-walt").onclick = () => setZone("waltrovka");
  $("f-okoli").onclick = () => setZone("okoli");
  $("f-veg").onclick = () => { state.veg = !state.veg; $("f-veg").setAttribute("aria-pressed", state.veg); render(); };
  $("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  $("picks").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-only]"); if (!b) return;
    const id = b.dataset.only;
    const target = !id || state.only === id ? null : id;
    const animId = target || state.only;           // card that zooms: the chosen one, or the one we leave
    const cardEl = (cid) => cid && $("grid").querySelector('.card[data-id="' + cid + '"]');
    const before = cardEl(animId);
    const from = before ? before.getBoundingClientRect() : null;
    state.only = target; state.anim = animId; render(); state.anim = null;
    const el = cardEl(animId);
    if (!el) return;
    // No automatic scrolling: the page stays where it is and the user scrolls.
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    const n = el.getBoundingClientRect();
    const start = from
      ? "translate(" + (from.left - n.left) + "px," + (from.top - n.top) + "px) scale(" + (from.width / n.width) + ")"
      : "scale(.9)";
    el.style.transformOrigin = from ? "top left" : "center top";
    el.style.transition = "none";
    el.style.transform = start;
    el.getBoundingClientRect();
    setTimeout(() => {
      el.style.transition = "transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s";
      el.style.transform = "";
      const done = () => { el.style.transition = el.style.transformOrigin = ""; el.removeEventListener("transitionend", done); };
      el.addEventListener("transitionend", done);
      setTimeout(done, 700);
    }, 20);
  });

  function loadData() {
    return fetch("menus.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function apply(data) {
    state.data = data;
    const keys = weekDays().map(iso), today = iso(new Date());
    // Today if it is in the loaded week; otherwise the first weekday that has any menu.
    if (!state.day || !keys.includes(state.day)) {
      state.day = keys.includes(today) ? today
        : keys.find((k) => data.restaurants.some((r) => r.days && r.days[k] && r.days[k].length)) || keys[0];
    }
    const u = new Date(data.updated);
    $("meta").textContent = "Aktualizováno " + DOW[u.getDay()] + " " + u.getDate() + ". " + (u.getMonth() + 1) + ". " +
      String(u.getHours()).padStart(2, "0") + ":" + String(u.getMinutes()).padStart(2, "0");
    renderDays(); render();
  }
  loadData().then(apply).catch(() => {
    $("meta").textContent = "";
    $("grid").innerHTML = '<div class="err">Menu se nepodařilo načíst. Zkus stránku obnovit.</div>';
  });

})();
</script>
</body>
</html>
